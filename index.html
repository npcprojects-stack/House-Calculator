<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nilprabha Constructions</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#0b6e4f,#2e8b57);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.card{

background:white;

width:100%;

max-width:420px;

padding:25px;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.25);

}

.logo{

text-align:center;

font-size:30px;

}

h1{

text-align:center;

color:#0b6e4f;

margin-top:10px;

}

p{

text-align:center;

color:#666;

margin-bottom:20px;

}

label{

font-weight:600;

margin-top:15px;

display:block;

}

input,select{

width:100%;

padding:14px;

margin-top:8px;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;

}

button{

width:100%;

padding:15px;

margin-top:20px;

border:none;

border-radius:12px;

background:#0b6e4f;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#09553d;

}

.result{

margin-top:20px;

background:#f4fff8;

padding:18px;

border-radius:12px;

display:none;

}

.amount{

font-size:32px;

font-weight:bold;

color:#0b6e4f;

margin-top:10px;

}

.footer{

margin-top:20px;

text-align:center;

font-size:13px;

color:#777;

}.amount2{

font-size:18px;

margin-top:10px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">🏗️</div>

<h1>Nilprabha Constructions</h1>

<p>House Construction Cost Calculator</p>

<label>Built-up Area (sq ft)</label>

<input type="number" id="area" placeholder="Example: 1000">

<label>Number of Floors</label>

<input type="number" id="floors" value="1">

<label>Construction Quality</label>

<select id="quality">

<option value="1800">🟢 Basic</option>

<option value="2300" selected>🔵 Standard</option>

<option value="3000">🟡 Premium</option>

</select>

<button onclick="calculate()">Calculate Budget</button>

<div class="result" id="result">

<div>Estimated Construction Cost</div>

<div class="amount" id="cost">₹0</div>

<div class="amount2" id="areaResult"></div>

</div>

<div class="footer">

Nilprabha Constructions<br>

Buldhana, Maharashtra

</div>

</div>

<script>

function calculate(){

let area=parseFloat(document.getElementById("area").value);

let floors=parseFloat(document.getElementById("floors").value);

let rate=parseFloat(document.getElementById("quality").value);

if(isNaN(area)||area<=0){

alert("Please enter Built-up Area.");

return;

}

let totalArea=area*floors;

let totalCost=totalArea*rate;

document.getElementById("result").style.display="block";

document.getElementById("cost").innerHTML="₹"+totalCost.toLocaleString("en-IN");

document.getElementById("areaResult").innerHTML="Built-up Area : "+totalArea.toLocaleString("en-IN")+" sq ft";

}

</script>

</body>

</html>
