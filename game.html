<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC Brick Stack</title>

<style>
body{
margin:0;
background:#1f2937;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,sans-serif;
overflow:hidden;
}

h1{
color:white;
position:absolute;
top:20px;
}

canvas{
background:#87CEEB;
border:4px solid white;
border-radius:12px;
}
</style>

</head>

<body>

<h1>🧱 NPC Brick Stack</h1>

<canvas id="gameCanvas" width="400" height="700"></canvas>

<script>

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let x = 0;
let direction = 3;

function gameLoop() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#b55239";
    ctx.fillRect(x,650,100,30);

    x += direction;

    if(x <= 0 || x >= 300){
        direction *= -1;
    }

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
